[package]
name = "Cove"
version = "0.5.0"
description = "Time, held. A calm Dynamic Island-style overlay for your desktop."
authors = ["Nobbel"]
license = "MIT"
repository = "https://github.com/nobberu/Cove"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[profile.dev]
debug = "line-tables-only"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_Input_KeyboardAndMouse",
] }
webview2-com = "0.39"
windows = "0.62"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2.7.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"

[dependencies]
log = "0.4"
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
